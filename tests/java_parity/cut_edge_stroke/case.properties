# Cutting at the top left bed corner with a 2 mm stroke: only the centre
# line counts for vectors, so both sides accept although the stroke
# reaches beyond the bed.
name=edge_cut
svg=input.svg
operation=cut
power=60
speed=20
x_mm=0
y_mm=0
width_mm=20
height_mm=10
# Also compared in VisiCut's other orders and on the rotary axis.
variants=order=FILE, order=NEAREST, order=SMALLEST_FIRST, rotary_diameter_mm=100
