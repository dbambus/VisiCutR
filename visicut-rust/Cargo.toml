[package]
name = "visicutr"
version = "0.22.0"
edition = "2024"
rust-version = "1.88"
license = "LGPL-3.0-or-later"
repository = "https://github.com/dbambus/VisiCutR"
description = "VisiCutR laser job preparation for Windows, Linux, and macOS"

[lib]
name = "visicut_core"
crate-type = ["rlib"]

[features]
screenshot = ["eframe/__screenshot"]

[dependencies]
base64 = "0.22"
boa_engine = { version = "0.21.1", default-features = false }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
epaint_default_fonts = "=0.33.3"
i_overlay = "9.1"
hayro-svg = { version = "0.4", default-features = false, features = ["embed-fonts"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png"] }
resvg = "0.45"
rfd = "0.15"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }

# macOS: Apple-Event „Dokumente öffnen“ abfangen (src/open_files.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSString", "NSURL"] }

# Linux: Speichergrenze des Skript-Hilfsprozesses (src/import/plf/script.rs).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Windows: Dateitypen im Benutzerzweig der Registry zuordnen (src/file_types.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell"] }

# Windows: VisiCut-Symbol und Versionsangaben in die .exe einbetten (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true

# The JavaScript engine only runs small import scripts: optimise it for size.
[profile.release.package.boa_engine]
opt-level = "z"
[profile.release.package.boa_parser]
opt-level = "z"
[profile.release.package.boa_ast]
opt-level = "z"
[profile.release.package.boa_string]
opt-level = "z"
[profile.release.package.boa_interner]
opt-level = "z"
[profile.release.package.regress]
opt-level = "z"
